name: Build Android APK (Curseur PR)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java 17 (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses || true

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android (génère le dossier android/)
        run: npx cap add android

      - name: Forcer les permissions de géolocalisation dans AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          )

          if "ACCESS_FINE_LOCATION" in content and "ACCESS_COARSE_LOCATION" in content:
              print("Permissions déjà présentes dans le manifeste, aucune modification nécessaire.")
          else:
              # Insère les balises <uses-permission> juste après la balise <manifest ...>
              new_content, count = re.subn(
                  r'(<manifest[^>]*>)',
                  r'\1\n' + perms.rstrip('\n'),
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Impossible de trouver la balise <manifest> dans AndroidManifest.xml")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("✔ Permissions ACCESS_FINE_LOCATION / ACCESS_COARSE_LOCATION ajoutées au manifeste.")

          # Vérification finale : affiche l'extrait du manifeste pour contrôle dans les logs
          with open(path, "r", encoding="utf-8") as f:
              print(f.read()[:800])
          PY

      - name: Générer les icônes Android depuis assets/icon.png
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Synchroniser les assets web vers le projet natif
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Builder l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Récupérer l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: curseur-pr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
